name: Build Phoenicx SSH

# Every run builds ALL files:
#   PhoenicxSSH-Android-arm64.apk     PhoenicxSSH-Android-universal.apk
#   PhoenicxSSH-Play.aab              (signed with the Play upload key)
#   PhoenicxSSH-Windows-Setup.exe     PhoenicxSSH-Windows-Portable.zip
# They appear as downloads on the run's page (Artifacts).
# "Run workflow" (or pushing a v* tag) also publishes them together as a
# GitHub Release marked "Latest", so the links in README.md always point to
# the newest files.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.8.0). Leave empty to use the version in pubspec.yaml"
        required: false
        default: ""
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (APKs + Play bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then V="$GITHUB_REF_NAME"; fi
          if [ -z "$V" ]; then V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//'); fi
          echo "V=${V#v}" >> $GITHUB_ENV
          echo "Building version ${V#v}"

      - name: Create Android project files
        run: |
          flutter create --org com.hanson --project-name phoenicx_ssh --platforms android .
          rm -rf test
          cp branding/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Work around an Android lint crash in plugins (Google bug) on newer Flutter
          printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.startsWith("lintVital")) enabled = false\n    }\n}\n' >> android/build.gradle.kts
          cp -r branding/android/res/* android/app/src/main/res/
          KDIR=android/app/src/main/kotlin/com/hanson/phoenicx_ssh
          mkdir -p $KDIR
          rm -f $KDIR/*.kt
          cp branding/android/kotlin/*.kt $KDIR/

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APKs
        run: |
          flutter build apk --release --build-name "$V" --build-number "${{ github.run_number }}" --dart-define=APP_VERSION="$V"
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/PhoenicxSSH-Android-universal.apk
          flutter build apk --release --split-per-abi --build-name "$V" --build-number "${{ github.run_number }}" --dart-define=APP_VERSION="$V"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/PhoenicxSSH-Android-arm64.apk

      - name: Sign APKs with a permanent key (so updates install over the old version)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UP_B64: ${{ secrets.PLAY_UPLOAD_KEY_BASE64 }}
          UP_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          # Without this, every CI run signs with a brand-new debug key and Android
          # refuses to install an update over the previous APK.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.bin; TYPE=JKS; ALIAS="${KS_ALIAS:-phoenicx}"; PASS="$KS_PASS"
          elif [ -n "$UP_B64" ]; then
            echo "$UP_B64" | tr -d ' \r\n' | base64 -d > ks.bin; TYPE=PKCS12; ALIAS=upload; PASS="$UP_PASS"
          else
            echo "::error::No signing key secret set - APK updates would not install over older versions."; exit 1
          fi
          export PASS
          for f in out/*.apk; do
            "$BT/apksigner" sign --ks ks.bin --ks-type $TYPE --ks-key-alias "$ALIAS" \
              --ks-pass env:PASS --key-pass env:PASS "$f"
            "$BT/apksigner" verify --print-certs "$f" | grep -m2 -E "DN|SHA-256"
            if "$BT/apksigner" verify --print-certs "$f" | grep -q "Android Debug"; then echo "::error::$f is still debug-signed"; exit 1; fi
          done
          rm -f ks.bin out/*.idsig

      - name: Build Play Store bundle (.aab)
        run: |
          flutter build appbundle --release --build-name "$V" --build-number "$((100 + ${{ github.run_number }}))" --dart-define=APP_VERSION="$V"
          cp build/app/outputs/bundle/release/app-release.aab out/app.aab

      - name: Sign the bundle with the Play upload key
        env:
          KEY_B64: ${{ secrets.PLAY_UPLOAD_KEY_BASE64 }}
          KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ]; then
            echo "::warning::PLAY_UPLOAD_KEY_BASE64 / PLAY_UPLOAD_KEY_PASSWORD not set - bundle left UNSIGNED."
            mv out/app.aab out/PhoenicxSSH-Play-UNSIGNED.aab
            exit 0
          fi
          # Flutter signs release builds with the debug key by default; Play rejects that, so strip it first.
          zip -q -d out/app.aab 'META-INF/MANIFEST.MF' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' || true
          echo "$KEY_B64" | tr -d ' \r\n' | base64 -d > upload.p12
          jarsigner -keystore upload.p12 -storetype PKCS12 -storepass:env KEY_PASS -keypass:env KEY_PASS \
            -digestalg SHA-256 -sigalg SHA256withRSA out/app.aab upload
          rm -f upload.p12
          jarsigner -verify out/app.aab | grep "jar verified"
          if keytool -printcert -jarfile out/app.aab | grep -q "Android Debug"; then echo "::error::Bundle still has the debug signature"; exit 1; fi
          mv out/app.aab out/PhoenicxSSH-Play.aab

      - name: List files
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenicxSSH-${{ env.V }}-Android-arm64.apk
          path: out/PhoenicxSSH-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoenicxSSH-${{ env.V }}-Android-universal.apk
          path: out/PhoenicxSSH-Android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoenicxSSH-${{ env.V }}-Play.aab
          path: out/*.aab

  windows:
    name: Windows (Setup.exe + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then V="$GITHUB_REF_NAME"; fi
          if [ -z "$V" ]; then V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//'); fi
          echo "V=${V#v}" >> $GITHUB_ENV

      - name: Create Windows project files
        shell: pwsh
        run: |
          flutter create --org com.hanson --project-name phoenicx_ssh --platforms windows .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          Copy-Item branding/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force
          (Get-Content windows/runner/main.cpp) -replace 'L"phoenicx_ssh"', 'L"Phoenicx SSH"' | Set-Content windows/runner/main.cpp
          (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "phoenicx_ssh"\)', 'set(BINARY_NAME "PhoenicxSSH")' | Set-Content windows/CMakeLists.txt

      - name: Get packages
        run: flutter pub get

      - name: Build
        shell: bash
        run: flutter build windows --release --build-name "$V" --build-number "${{ github.run_number }}" --dart-define=APP_VERSION="$V"

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath out/PhoenicxSSH-Windows-Portable.zip

      - name: Installer (Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=$env:V" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutDir=$PWD\out" "/DOutName=PhoenicxSSH-Windows-Setup" branding\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out

      - name: Test the installer (silent install + uninstall)
        shell: pwsh
        run: |
          $setup = "out\PhoenicxSSH-Windows-Setup.exe"
          $dir = "$env:RUNNER_TEMP\PhoenicxTest"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait
          foreach ($f in "PhoenicxSSH.exe","flutter_windows.dll","data\app.so") {
            if (!(Test-Path "$dir\$f")) { Write-Error "Installer is missing $f"; exit 1 }
          }
          Write-Host "Installed OK"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\PhoenicxSSH.exe") { Write-Error "Uninstall left files"; exit 1 }
          Write-Host "Uninstalled OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenicxSSH-${{ env.V }}-Windows-Setup.exe
          path: out/PhoenicxSSH-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PhoenicxSSH-${{ env.V }}-Windows-Portable.zip
          path: out/PhoenicxSSH-Windows-Portable.zip

  release:
    name: Publish release (all files together)
    needs: [android, windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then V="$GITHUB_REF_NAME"; fi
          if [ -z "$V" ]; then V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//'); fi
          echo "V=${V#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check all files are here
        run: |
          ls -la dist
          for f in PhoenicxSSH-Android-arm64.apk PhoenicxSSH-Android-universal.apk PhoenicxSSH-Windows-Setup.exe PhoenicxSSH-Windows-Portable.zip; do
            [ -f "dist/$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          ls dist/*.aab >/dev/null || { echo "::error::Play bundle is missing"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Phoenicx SSH v${{ env.V }}
          make_latest: true
          files: dist/*
          body: |
            ### Downloads
            | File | For |
            |---|---|
            | **PhoenicxSSH-Windows-Setup.exe** | Windows 10/11 – installs with Start-menu and desktop shortcut |
            | **PhoenicxSSH-Windows-Portable.zip** | Windows without installing – unzip and run `PhoenicxSSH.exe` |
            | **PhoenicxSSH-Android-arm64.apk** | Samsung and other modern Android phones (smaller) |
            | **PhoenicxSSH-Android-universal.apk** | Any Android device (bigger) |
            | **PhoenicxSSH-Play.aab** | Google Play Console upload only (signed with the upload key) – not for installing on a phone |

            The Play Store version and these APKs are signed differently: uninstall one before installing the other (export your connections first).
