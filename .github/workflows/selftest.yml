name: Self test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    name: Linux server end-to-end + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install test server tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server putty-tools clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb xdotool imagemagick >/dev/null
          sudo apt-get remove -y -qq nethogs >/dev/null 2>&1 || true
          pip install -q cryptography

      - name: Create keys in every format
        run: |
          mkdir -p keys ~/.ssh && cd keys
          ssh-keygen -q -t ed25519 -N '' -f id_ed25519
          ssh-keygen -q -t rsa -b 2048 -m PEM -N '' -f id_rsa_pem
          ssh-keygen -q -t ecdsa -b 256 -N '' -f id_ecdsa
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out oracle_pkcs8.key 2>/dev/null
          ssh-keygen -y -f oracle_pkcs8.key > oracle_pkcs8.key.pub
          cp id_ecdsa ec_pkcs8.key && ssh-keygen -q -p -N '' -m PKCS8 -f ec_pkcs8.key
          openssl genpkey -algorithm ed25519 -out ed25519_pkcs8.key
          python3 -c "from cryptography.hazmat.primitives import serialization as s; k=s.load_pem_private_key(open('ed25519_pkcs8.key','rb').read(),None); print(k.public_key().public_bytes(s.Encoding.OpenSSH,s.PublicFormat.OpenSSH).decode())" > ed25519_pkcs8.key.pub
          puttygen id_rsa_pem -O private -o rsa.ppk
          puttygen id_rsa_pem -O private --ppk-param version=2 -o rsa_v2.ppk
          puttygen id_ed25519 -O private -o ed25519.ppk
          puttygen id_ecdsa -O private -o ecdsa.ppk
          head -3 oracle_pkcs8.key ec_pkcs8.key ed25519_pkcs8.key rsa.ppk | cut -c1-60
          cat *.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

      - name: Start SSH server (port 2222) and a Docker container
        run: |
          echo "$USER:phx123" | sudo chpasswd
          sudo mkdir -p /run/sshd && sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p 2222 -o StrictModes=no -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=yes
          docker run -d --name phx-test nginx:alpine
          sleep 2
          ssh -o StrictHostKeyChecking=no -i keys/id_ed25519 -p 2222 $USER@127.0.0.1 'echo ssh-ok; sudo -n true && echo sudo-ok'

      - name: Get packages
        run: flutter pub get

      - name: End-to-end tests
        env:
          SSH_PORT: "2222"
          KEY_DIR: ${{ github.workspace }}/keys
        run: |
          export SSH_USER=$USER
          flutter test test/e2e_test.dart --reporter expanded

      - name: Speed benchmark (simulated 40 ms network round trip)
        if: always()
        env:
          SSH_PORT: "2222"
          KEY_DIR: ${{ github.workspace }}/keys
        run: |
          export SSH_USER=$USER
          sudo tc qdisc add dev lo root netem delay 20ms
          flutter test test/bench_test.dart --reporter expanded || true
          sudo tc qdisc del dev lo root || true

      - name: Build Linux app for screenshots
        if: always()
        run: |
          flutter create --org com.hanson --project-name phoenicx_ssh --platforms linux .
          rm -rf test/widget_test.dart
          flutter build linux --release

      - name: Run app, type with a real keyboard, take screenshots
        if: always()
        run: |
          mkdir -p shots
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          PHOENICX_SELFTEST="$USER:phx123@127.0.0.1:2222" PHOENICX_SELFTEST_MONITOR=30 \
            build/linux/x64/release/bundle/phoenicx_ssh > app.log 2>&1 &
          sleep 14
          WID=$(xdotool search --onlyvisible --class phoenicx 2>/dev/null | head -1 || true)
          echo "window: $WID"
          [ -n "$WID" ] && xdotool windowsize $WID 1400 860 && xdotool windowactivate --sync $WID || true
          sleep 2
          xdotool type --delay 60 'echo typed_with_keyboard && uptime'
          xdotool key Return
          sleep 3
          import -window root shots/1-terminal.png
          # Drag-select some lines with the mouse, like a user would.
          xdotool mousemove --window $WID 40 140 mousedown 1 sleep 0.2 mousemove --window $WID 300 200 sleep 0.2 mousemove --window $WID 600 260 sleep 0.2 mouseup 1
          sleep 1.5
          import -window root shots/1b-selected.png
          xdotool mousemove --window $WID 600 600 click 1
          sleep 30
          import -window root shots/2-monitor.png
          sleep 8
          import -window root shots/3-monitor-later.png
          tail -30 app.log || true
          for f in shots/*.png; do
            convert "$f" -resize 75% -quality 70 "${f%.png}.jpg"
            echo "@@IMG $(basename ${f%.png}) $(base64 -w 0 ${f%.png}.jpg)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: shots/

  windows:
    name: Windows typing test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        shell: pwsh
        run: |
          flutter create --org com.hanson --project-name phoenicx_ssh --platforms windows .
          (Get-Content windows/runner/main.cpp) -replace 'L"phoenicx_ssh"', 'L"Phoenicx SSH"' | Set-Content windows/runner/main.cpp
          flutter pub get
          flutter build windows --release

      - name: Type into the app with real keystrokes
        shell: pwsh
        run: |
          pip install -q paramiko
          $log = "$env:RUNNER_TEMP\typed.log"
          New-Item -ItemType Directory -Force shots | Out-Null
          Start-Process python -ArgumentList ".github/selftest/fake_ssh_server.py", $log
          Start-Sleep 4
          $env:PHOENICX_SELFTEST = "test:test@127.0.0.1:2222"
          $env:PHOENICX_KEYLOG = "$env:RUNNER_TEMP\keylog.txt"
          Start-Process "build\windows\x64\runner\Release\phoenicx_ssh.exe"
          Start-Sleep 18
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, Microsoft.VisualBasic
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          Shot "1-connected"
          try { [Microsoft.VisualBasic.Interaction]::AppActivate("Phoenicx SSH") } catch { Write-Host "AppActivate failed: $_" }
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("echo hello123{ENTER}")
          Start-Sleep 3
          Shot "2-typed"
          # ---- Every special key, pressed like a real keyboard (with scan codes), checked byte by byte
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Threading;
          public class KB {
            [DllImport("user32.dll")] static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            [DllImport("user32.dll")] static extern uint MapVirtualKey(uint code, uint type);
            static void K(byte vk, bool up, bool ext) { keybd_event(vk, (byte)MapVirtualKey(vk, 0), (up ? 2u : 0u) | (ext ? 1u : 0u), UIntPtr.Zero); Thread.Sleep(20); }
            public static void Press(byte[] mods, byte vk, bool ext) {
              foreach (var m in mods) K(m, false, false);
              K(vk, false, ext); K(vk, true, ext);
              for (int i = mods.Length - 1; i >= 0; i--) K(mods[i], true, false);
            }
          }
          "@
          $C = [byte[]]@(0x11); $N = [byte[]]@(); $S = [byte[]]@(0x10); $A = [byte[]]@(0x12)
          $keys = @(
            @('Ctrl+X',$C,0x58,$false,'18'), @('Ctrl+O',$C,0x4F,$false,'0f'), @('Ctrl+D',$C,0x44,$false,'04'), @('Ctrl+C',$C,0x43,$false,'03'),
            @('Ctrl+A',$C,0x41,$false,'01'), @('Ctrl+E',$C,0x45,$false,'05'), @('Ctrl+Z',$C,0x5A,$false,'1a'), @('Ctrl+W',$C,0x57,$false,'17'),
            @('Ctrl+R',$C,0x52,$false,'12'), @('Ctrl+L',$C,0x4C,$false,'0c'), @('Ctrl+U',$C,0x55,$false,'15'), @('Ctrl+K',$C,0x4B,$false,'0b'),
            @('Ctrl+G',$C,0x47,$false,'07'), @('Ctrl+B',$C,0x42,$false,'02'), @('Ctrl+T',$C,0x54,$false,'14'), @('Ctrl+Y',$C,0x59,$false,'19'),
            @('Up',$N,0x26,$true,'1b5b41'), @('Down',$N,0x28,$true,'1b5b42'), @('Left',$N,0x25,$true,'1b5b44'), @('Right',$N,0x27,$true,'1b5b43'),
            @('Tab',$N,0x09,$false,'09'), @('Esc',$N,0x1B,$false,'1b'), @('Backspace',$N,0x08,$false,'7f'), @('Enter',$N,0x0D,$false,'0d'),
            @('Home',$N,0x24,$true,'1b5b48'), @('End',$N,0x23,$true,'1b5b46'), @('Delete',$N,0x2E,$true,'1b5b337e'),
            @('PageUp',$N,0x21,$true,'1b5b357e'), @('PageDown',$N,0x22,$true,'1b5b367e'), @('F1',$N,0x70,$false,'1b4f50'), @('F10',$N,0x79,$false,'1b5b32317e'),
            @('Alt+B',$A,0x42,$false,'1b62'), @('a',$N,0x41,$false,'61'), @('Shift+A',$S,0x41,$false,'41'), @('Shift+Tab',$S,0x09,$false,'1b5b5a')
          )
          $tlog = "$log.t"
          $bad = 0
          $lat = @()
          foreach ($k in $keys) {
            $before = if (Test-Path $tlog) { (Get-Content $tlog).Count } else { 0 }
            $t0 = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() / 1000.0
            [KB]::Press($k[1], [byte]$k[2], $k[3])
            Start-Sleep -Milliseconds 350
            $new = @(Get-Content $tlog | Select-Object -Skip $before)
            $hex = ($new | ForEach-Object { ($_ -split ' ')[1] }) -join ''
            $ms = if ($new.Count -gt 0) { [math]::Round((([double](($new[0] -split ' ')[0])) - $t0) * 1000) } else { -1 }
            $ok = $hex -eq $k[4]
            if (-not $ok) { $bad++ } else { $lat += $ms }
            Write-Host ("{0,-10} expected {1,-12} got {2,-14} {3,5} ms  {4}" -f $k[0], $k[4], $hex, $ms, $(if ($ok) {'OK'} else {'WRONG'}))
          }
          if ($lat.Count -gt 0) { Write-Host ("Average key-to-server time: {0:N1} ms" -f (($lat | Measure-Object -Average).Average)) }
          if ($bad -gt 0) { Write-Host "::error::$bad keys sent wrong bytes" }
          Write-Host "----- app key log (Ctrl lines) -----"
          if (Test-Path $env:PHOENICX_KEYLOG) { $kl = Get-Content $env:PHOENICX_KEYLOG; Write-Host "lines: $($kl.Count)"; $kl | Select-String -Pattern ' hw | onOutput' | Select-Object -Skip 40 -First 16 | ForEach-Object { Write-Host "KL $($_.Line)" } } else { Write-Host "no key log file" }
          Shot "2b-keys"

          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          }
          "@
          Set-Clipboard -Value "nothing"
          [Mouse]::SetCursorPos(12, 100); Start-Sleep -Milliseconds 200
          [Mouse]::mouse_event(2, 0, 0, 0, 0)
          for ($i = 1; $i -le 20; $i++) { [Mouse]::SetCursorPos(12 + $i * 15, 100 + $i * 3); Start-Sleep -Milliseconds 30 }
          [Mouse]::mouse_event(4, 0, 0, 0, 0)
          Start-Sleep 2
          Shot "3-selected"
          $clip = Get-Clipboard -Raw
          Write-Host "Clipboard after selecting: [$clip]"
          Get-ChildItem shots\*.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $w = [int]($img.Width * 0.6); $h = [int]($img.Height * 0.6)
            $small = New-Object System.Drawing.Bitmap $img, $w, $h
            $jpg = $_.FullName -replace '\.png$', '.jpg'
            $small.Save($jpg, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Host ("@@IMG " + $_.BaseName + " " + [Convert]::ToBase64String([IO.File]::ReadAllBytes($jpg)))
          }
          if (Test-Path $log) { $t = Get-Content $log -Raw; Write-Host "Server received: [$t]" } else { $t = "" ; Write-Host "Nothing received" }
          if ($t -notmatch "echo hello123") { Write-Host "::error::Typing did not reach the SSH server"; exit 1 }
          Write-Host "Typing works on Windows"
          if ($bad -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots/

  android:
    name: Android emulator test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: SSH server for the emulator (host is 10.0.2.2 from inside)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server imagemagick >/dev/null
          echo "$USER:phx123" | sudo chpasswd
          sudo mkdir -p /run/sshd && sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p 2222 -o StrictModes=no -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=yes

      - name: Build test APK
        run: |
          flutter create --org com.hanson --project-name phoenicx_ssh --platforms android .
          rm -f test/widget_test.dart
          cp branding/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r branding/android/res/* android/app/src/main/res/
          KDIR=android/app/src/main/kotlin/com/hanson/phoenicx_ssh
          mkdir -p $KDIR && rm -f $KDIR/*.kt && cp branding/android/kotlin/*.kt $KDIR/
          flutter build apk --release --target-platform android-x64 \
            --dart-define=SELFTEST="$USER:phx123@10.0.2.2:2222" --dart-define=SELFTEST_MONITOR=75
          cp build/app/outputs/flutter-apk/app-release.apk app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/selftest/android_test.sh

      - name: Print screenshots
        if: always()
        run: |
          ls shots || true
          for f in shots/*.png; do
            convert "$f" -resize 40% -quality 70 "${f%.png}.jpg"
            echo "@@IMG $(basename ${f%.png}) $(base64 -w 0 ${f%.png}.jpg)"
          done
          test -f /tmp/android_typed_ok && echo "ANDROID TYPING CONFIRMED ON SERVER"
