name: phoenicx_ssh
description: Phoenicx SSH - a lightweight tabbed SSH client with live server monitoring.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  xterm:
    git:
      url: https://github.com/lollipopkit/xterm.dart
      ref: 725a78b986d7c4dea0e4852d61ff19523f69dbbe
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^11.0.0
  file_picker: ^13.0.0
  url_launcher: ^6.3.0
  window_manager: '>=0.4.3 <0.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
