name: phoenicx_ssh
description: Phoenicx SSH - a lightweight tabbed SSH client with live server monitoring.
publish_to: 'none'
version: 1.8.7+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  xterm:
    git:
      url: https://github.com/lollipopkit/xterm.dart
      ref: 725a78b986d7c4dea0e4852d61ff19523f69dbbe
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^11.0.0
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  url_launcher: ^6.3.0
  window_manager: '>=0.4.3 <0.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/share.jpg

# Microsoft Store package (built by GitHub Actions: dart run msix:create --store)
msix_config:
  display_name: Phoenicx SSH
  publisher_display_name: Hanson D
  identity_name: HansonD.PhoenicxSSH
  publisher: CN=0A008030-E5DF-4ECF-AA74-B9D9217C239C
  logo_path: assets/logo.png
  capabilities: internetClient,internetClientServer,privateNetworkClientServer
  languages: en-us
  build_windows: false
